name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KS_B64_RAW: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS_B64=$(printf %s "$KS_B64_RAW" | tr -d ' \r\n\t')
          KS_PASS=$(printf %s "$KS_PASS_RAW" | tr -d ' \r\n\t')
          echo "::notice::Довжина KEYSTORE_BASE64=${#KS_B64} (має бути 3516); довжина пароля=${#KS_PASS} (має бути 20)"
          echo "::notice::Відбиток KEYSTORE_BASE64=$(printf %s "$KS_B64" | sha256sum | cut -c1-12) (має бути 3b0f27a506ab)"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Один із секретів порожній"
            exit 1
          fi
          printf %s "$KS_B64" | base64 -d > "$RUNNER_TEMP/allbooks.keystore"
          keytool -list -keystore "$RUNNER_TEMP/allbooks.keystore" -storepass "$KS_PASS" > /dev/null 2>&1 || {
            echo "::error::Файл ключа або пароль невірні, дивись довжини вище"
            exit 1
          }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/allbooks.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -A8 "What went wrong" build.log | head -14 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-release.log || {
            grep -A8 "What went wrong" build-release.log | head -14 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Verify signature
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            OUT=$("$AS" verify --print-certs "$APK")
            echo "$OUT"
            echo "$OUT" | grep -q "fd849d9ddaafc62d989dd63d286504e93acbe69b3558b4af4b7d7fe7985757be" || { echo "::error::НЕПРАВИЛЬНИЙ КЛЮЧ ПІДПИСУ: $APK"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AllBooks-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AllBooks-release
          path: app/build/outputs/apk/release/app-release.apk
