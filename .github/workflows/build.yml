name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Секрети KEYSTORE_BASE64 або KEYSTORE_PASSWORD порожні"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/allbooks.keystore"
          keytool -list -keystore "$RUNNER_TEMP/allbooks.keystore" -storepass "$KS_PASS" > /dev/null 2>&1 || {
            echo "::error::Файл ключа або пароль невірні (перевір секрети)"
            exit 1
          }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/allbooks.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -A8 "What went wrong" build.log | head -14 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Verify signature
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          OUT=$("$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUT"
          echo "$OUT" | grep -q "fd849d9ddaafc62d989dd63d286504e93acbe69b3558b4af4b7d7fe7985757be" || { echo "::error::НЕПРАВИЛЬНИЙ КЛЮЧ ПІДПИСУ"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: AllBooks-debug
          path: app/build/outputs/apk/debug/app-debug.apk